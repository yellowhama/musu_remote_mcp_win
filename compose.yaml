name: remote-dev-mcp
services:
  mcp:
    build: .
    image: remote-dev-mcp:local
    container_name: remote-dev-mcp
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_LOCAL_PORT:-39391}:3000"
      - "127.0.0.1:${MCP_PREVIEW_PORT:-39392}:3001"
    environment:
      TZ: ${TZ:-UTC}
      MCP_TRUST_PROXY_HOPS: 1
      MCP_ALLOW_NO_AUTH: "false"
      MCP_OAUTH_ENABLED: "true"
      MCP_DEFAULT_CWD: ${MCP_DEFAULT_CWD:-/workspace/code}
      MCP_EDITABLE_ROOTS: ${MCP_EDITABLE_ROOTS:-/workspace/code,/workspace/wiki}
      MCP_BACKUP_ROOT: /backups
      MCP_JOBS_ROOT: /state/jobs
      PATH: /home/node/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${WORKSPACE_HOST_PATH:?Set WORKSPACE_HOST_PATH in .env}:/workspace
      - ./state:/state
      - ${BACKUP_HOST_PATH:-./backups}:/backups
      - dev-home:/home/node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${MCP_MEMORY_LIMIT:-1536m}
    cpus: ${MCP_CPU_LIMIT:-2}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health',{headers:{Host:'localhost'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: remote-dev-mcp-tunnel
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, --protocol, http2, --url, "http://mcp:3000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  dev-home:
